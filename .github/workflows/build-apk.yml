name: Build Mokuroku APK

# Manual only: nothing runs or downloads until you click "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already have the Android SDK and sdkmanager.
      # Do not use android-actions/setup-android here: it installs the long-removed
      # "tools" package and fails before the build even starts.
      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
            [ -x "$d/sdkmanager" ] && export PATH="$d:$PATH"
          done
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export SDK_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          export PATH="$SDK_ROOT/build-tools/36.0.0:$PATH"
          bash scripts/build-apk.sh .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epub-vocab-apk
          path: build/app.apk
          if-no-files-found: error
          retention-days: 30
