name: Build EPUB Vocab APK

# Manual only: nothing runs or downloads until you click "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export SDK_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          export PATH="$SDK_ROOT/build-tools/36.0.0:$PATH"
          bash scripts/build-apk.sh .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epub-vocab-apk
          path: build/app.apk
          if-no-files-found: error
          retention-days: 30
